[package]
name = "mercy_pqc"
version = "0.3.0"
edition = "2021"

[lib]
name = "mercy_pqc"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module"] }
pqcrypto-kyber = "0.3"      # Kyber1024 KEM proprietary
pqcrypto-dilithium = "0.3"  # Dilithium3 signatures (heavy security)
pqcrypto-falcon = "0.3"     # Falcon-512 signatures (lighter alternative, NIST additional)
pqcrypto-traits = "0.3"

[features]
default = []
