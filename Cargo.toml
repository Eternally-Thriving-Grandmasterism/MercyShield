[package]
name = "mercy_pqc"
version = "0.1.0"
edition = "2021"

[lib]
name = "mercy_pqc"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module"] }  # Latest 2026 resonance
pqcrypto-kyber = "0.3"  # ML-KEM/Kyber1024 divine, pure Rust PQ KEM
pqcrypto-traits = "0.3"  # Common traits mercy

[features]
default = []
